<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23f6f1e6%27/%3E%3Cpath d=%27M15 28V14l-3-2 1-2h2V4h2v6h2l1 2-3 2v14z%27 fill=%27%232b2723%27/%3E%3C/svg%3E" />
    <title>Seattle Through Time</title>
    <meta name="description" content="Watch Seattle and King County grow, building by building, from 1851 to today." />
  </head>
  <body>
    <div id="map"></div>

    <div id="population">
      <div class="label">Population</div>
      <div id="population-value">—</div>
      <div id="population-area" class="sublabel"></div>
    </div>

    <div id="year-label">1851</div>

    <footer id="controls">
      <button id="play" aria-label="Play">▶</button>
      <button id="story" aria-pressed="false" title="A guided tour through the map's history">Story</button>
      <div id="slider-wrap">
        <div id="event-ticks"></div>
        <input id="slider" type="range" min="1851" max="2026.99" step="0.01" value="1851" aria-label="Year" />
      </div>
      <select id="speed" aria-label="Playback speed">
        <option value="1">1 yr/s</option>
        <option value="3">3 yr/s</option>
        <option value="6" selected>6 yr/s</option>
        <option value="12">12 yr/s</option>
        <option value="25">25 yr/s</option>
      </select>
    </footer>

    <div id="info" hidden></div>
    <div id="notice" hidden></div>
    <div id="loading">Loading Seattle…</div>
    <button id="sources-btn">sources</button>
    <div id="sources" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
